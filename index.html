<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8" />
  <title>Mathverse · Jogos de Matemática</title>
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <meta name="theme-color" content="#0b1020" />
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div class="bg" aria-hidden="true">
    <span class="blob b1"></span><span class="blob b2"></span><span class="blob b3"></span>
    <div class="symbols" id="symbols"></div>
  </div>

  <header class="topbar">
    <a class="brand" href="#" id="brand"><span class="logo">∑</span><span>Mathverse</span></a>
    <button class="icon-btn" id="btn-sound" title="Som" aria-label="Alternar som">🔊</button>
  </header>

  <main>
    <!-- HUB -->
    <section id="hub">
      <div class="hero">
        <p class="eyebrow">Treine lógica · Cálculo · Raciocínio</p>
        <h1>Matemática que <em>vira jogo</em>.</h1>
        <p class="lead">Oito desafios para afiar a mente. Escolha um e bata seus recordes.</p>
      </div>
      <div class="cards" id="cards"></div>
    </section>

    <!-- PALCO -->
    <section id="stage" class="hidden">
      <div class="stage-bar">
        <button class="btn ghost" id="btn-back">← Jogos</button>
        <h2 id="stage-title"></h2>
        <span></span>
      </div>
      <div id="game-root"></div>
    </section>
  </main>

  <footer class="footer">
    <small>© Developed by Felipe Silva, Miquéias Ferreira e Antonio Carlos.</small>
  </footer>

  <div id="notify-container"></div>

  <script src="js/core.js"></script>
  <script src="js/sudoku.js"></script>
  <script src="js/rapidamente.js"></script>
  <script src="js/memoria.js"></script>
  <script src="js/sequencia.js"></script>
  <script src="js/jogo24.js"></script>
  <script src="js/verdadeiro.js"></script>
  <script src="js/g2048.js"></script>
  <script src="js/jornada.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
